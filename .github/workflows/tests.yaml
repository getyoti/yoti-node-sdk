name: Tests
on: [push, pull_request]

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting for sonarcloud
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm update

      - run: npm install --ignore-scripts --no-audit

      - run: npm run audit

      - run: npm run test

      - name: Fix code coverage paths
        run: sed -i 's/\/home\/runner\/work\/yoti-node-sdk\/yoti-node-sdk\//\/github\/workspace\//g' ./coverage/lcov.info

      - uses: sonarsource/sonarcloud-github-action@master
        if: github.event_name == 'push' && github.repository == 'getyoti/yoti-node-sdk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --ignore-scripts

      - run: npm update

      - name: print versions
        run: echo npm $(npm -v), node $(node -v)

      - run: npm install --ignore-scripts -p ./examples/digital-identity
      - run: npm install --ignore-scripts -p ./examples/idv
      - run: npm install --ignore-scripts -p ./examples/idv-identity-checks
      - run: npm install --ignore-scripts -p ./examples/profile
      - run: npm install --ignore-scripts -p ./examples/profile-identity-checks

      - run: npm run lint

  node-compatibility:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 16, 18, 20, 22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install --ignore-scripts

      - run: npm update

      # Jest 30 does not support Node 14/16
      - run: npm install --ignore-scripts jest@29

      - run: npm run test

  os-compatibility:
    name: Running in ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --ignore-scripts

      - run: npm update

      - run: npm run test
