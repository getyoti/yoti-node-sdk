name: Publish

# Publishes `yoti` to npmjs using npm Trusted Publishing (OIDC).
# No npm token anywhere: npm trusts this exact repo + workflow file + environment.
#
# Release flow:
#   1. Bump the version in package.json in a PR, merge to master.
#   2. This workflow sees an unpublished version, builds, tests and packs it.
#   3. A reviewer of the `npm` environment approves; the package is published.
#   4. Only after a successful publish, the v<version> tag and GitHub release are created.
#
# Pushes to master that don't change the version (or whose version is already on npm) do nothing.

on:
  push:
    branches: [master]
    paths: [package.json]
  # Retry a failed or rejected release from master without another commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    name: Check for new version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - name: Is this version already on npm?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Fail closed: only a definite 404 means "not published".
          if out=$(npm view "$name@$version" version --json --registry=https://registry.npmjs.org 2>/dev/null); then
            echo "$name@$version is already published, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(echo "$out" | node -p "JSON.parse(require('fs').readFileSync(0)).error?.code")
          if [ "$code" != "E404" ]; then
            echo "::error::Could not check npm for $name@$version ($code)"
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists but $name@$version is not on npm. Investigate before releasing."
            exit 1
          fi

          case "$version" in
            *-*) dist_tag=next ;;
            *)   dist_tag=latest ;;
          esac
          echo "Releasing $name@$version to dist-tag $dist_tag"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    # No id-token here: dependency install and tests never see a publishing identity.
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'

      - run: npm install --global npm@12.2.2

      - run: npm ci --ignore-scripts --no-audit

      - run: npm run audit

      - run: npm test

      - name: Pack
        id: pack
        run: |
          tarball=$(npm pack --ignore-scripts --json | node -p "JSON.parse(require('fs').readFileSync(0))[0].filename")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          sha256sum "$tarball"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npmjs
    needs: [check, build]
    runs-on: ubuntu-latest
    # Must match the environment configured as the trusted publisher on npmjs.
    # Protect it with required reviewers (prevent self-review) and restrict it to the master branch.
    environment:
      name: npm
      url: https://www.npmjs.com/package/yoti/v/${{ needs.check.outputs.version }}
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@12.2.2

      - run: echo "node $(node --version), npm $(npm --version)"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Publish
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
        run: |
          sha256sum "$TARBALL"
          npm publish "$TARBALL" --access public --tag "$DIST_TAG" --provenance --ignore-scripts

  release:
    name: Tag and create GitHub release
    needs: [check, build, publish]
    runs-on: ubuntu-latest
    # The only job that can write to the repo, and it runs only after npm has accepted the package.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          DIST_TAG: ${{ needs.check.outputs.dist-tag }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          prerelease=()
          [ "$DIST_TAG" = "latest" ] || prerelease=(--prerelease)
          gh release create "v$VERSION" "$TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes \
            "${prerelease[@]}"
